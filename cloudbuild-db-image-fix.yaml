# One-off: give the R$15,000 machinery product the drill photo requested for
# the live catalog. Mirrors the change in
# backend/seeders/20240101000001-initial-data.cjs for the already-seeded DB.
options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/crescebr-portfolio-9048/secrets/db-password/versions/latest
      env: DB_PASSWORD

steps:
  - name: gcr.io/cloud-builders/docker
    id: start-proxy
    args:
      - run
      - -d
      - --network=cloudbuild
      - --name=sqlproxy
      - gcr.io/cloud-sql-connectors/cloud-sql-proxy:latest
      - --address=0.0.0.0
      - --port=5432
      - crescebr-portfolio-9048:southamerica-east1:crescebr-db

  - name: postgres:15
    id: fix-image
    entrypoint: bash
    secretEnv: ['DB_PASSWORD']
    args:
      - -c
      - |
        set -e
        sleep 5
        export PGPASSWORD="$$DB_PASSWORD"
        psql -h sqlproxy -U crescebr_app -d crescebr -c "UPDATE products SET \"imageUrl\" = 'https://images.unsplash.com/photo-1716662383104-1dcc763a916d' WHERE price = 15000.00 AND \"unitPrice\" = 15000.00;"
        echo "--- R$15,000 product row after update ---"
        psql -h sqlproxy -U crescebr_app -d crescebr -c "SELECT id, name, price, \"unitPrice\", \"imageUrl\" FROM products WHERE price = 15000.00 AND \"unitPrice\" = 15000.00;"
